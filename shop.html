<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop – Ember &amp; Leaf</title>
<meta name="description" content="Browse loose-leaf tea and specialty coffee beans.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="shop">
<main id="main">
<div class="pagehead"><div class="wrap"><h1 id="shop-title">The shop</h1><p>Sample catalog for development. Prices are placeholders in INR.</p></div></div>
<section class="wrap">
  <div class="tools">
    <div class="chips" role="group" aria-label="Category">
      <button data-filter="all" aria-pressed="true">All</button>
      <button data-filter="tea" aria-pressed="false">Tea</button>
      <button data-filter="coffee" aria-pressed="false">Coffee</button>
    </div>
    <label class="sr" for="q">Search products</label>
    <input id="q" type="search" placeholder="Search name, origin or flavour">
    <label class="sr" for="sort">Sort</label>
    <select id="sort"><option value="name">Name</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
  </div>
  <p id="result-count" class="muted" aria-live="polite"></p>
  <div id="grid" class="grid"></div>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
